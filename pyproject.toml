[project]
name = "claude-code-sessions-cli"
dynamic = ["version"]
description = "ccs: browse and resume every Claude Code session across all your projects"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = [
    "claude-code", "claude", "anthropic", "ai-coding", "agentic-coding", "cli", "terminal", "tui", "fzf",
    "session-manager", "session-history", "conversation-history", "resume", "developer-tools", "productivity",
    "token-usage", "cost",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/linnykoleh/claude-code-sessions"
Documentation = "https://github.com/linnykoleh/claude-code-sessions#readme"
Repository = "https://github.com/linnykoleh/claude-code-sessions"
Issues = "https://github.com/linnykoleh/claude-code-sessions/issues"

[project.scripts]
ccs = "ccs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]  # 1.27: PEP 639 license fields
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ccs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
