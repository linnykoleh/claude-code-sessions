[project]
name = "cc-sessions"
version = "0.1.0"
description = "ccs: browse and resume every Claude Code session across all your projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
ccs = "ccs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
